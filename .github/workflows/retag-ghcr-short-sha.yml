name: Retag GHCR short SHA

# Point short SHA tags (7 chars) at an existing full-SHA digest.
# Use when a deploy used `IMAGE_TAG=<short>` but build-images only pushed full SHA.

on:
  workflow_dispatch:
    inputs:
      full_sha:
        description: Full 40-char git SHA already present on GHCR
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - backend
          - auth
          - deploy-api
          - ext-authz
          - agent-base
          - mcp-base
          - hermes-base
          - path-graph-rag-mcp
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag short SHA from full
        env:
          FULL_SHA: ${{ inputs.full_sha }}
          IMAGE: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ ! "$FULL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "full_sha must be 40 hex chars, got: $FULL_SHA" >&2
            exit 1
          fi
          SHORT_SHA="${FULL_SHA:0:7}"
          SRC="ghcr.io/${OWNER}/agent-runtime/${IMAGE}:${FULL_SHA}"
          DST="ghcr.io/${OWNER}/agent-runtime/${IMAGE}:${SHORT_SHA}"
          echo "imagetools create --tag ${DST} ${SRC}"
          docker buildx imagetools create --tag "$DST" "$SRC"
          docker buildx imagetools inspect "$DST"
