name: Build and push images

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  hermes-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Hermes install policy
        run: bash scripts/hermes/check-hermes-install-policy.sh

      - name: Hermes OCI unit tests
        env:
          UV_INDEX_GITHUB_USERNAME: x-access-token
          UV_INDEX_GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv sync --all-packages
          uv run pytest runtimes/hermes-base/tests/test_oci_runtime_slim.py \
            runtimes/hermes-base/tests/test_prune_hermes.py -q

  build:
    needs: hermes-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: services/ext-authz/Dockerfile
            image: ext-authz
          - dockerfile: services/auth/Dockerfile
            image: auth
          - dockerfile: services/deploy-api/Dockerfile
            image: deploy-api
          - dockerfile: runtimes/agent-base/Dockerfile
            image: agent-base
          - dockerfile: runtimes/mcp-base/Dockerfile
            image: mcp-base
          - dockerfile: backend/Dockerfile
            image: backend
          - dockerfile: runtimes/hermes-base/Dockerfile
            image: hermes-base
          - dockerfile: deploy/examples/custom-image/path-graph-rag-mcp/Dockerfile
            image: path-graph-rag-mcp

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent-runtime/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            HERMES_REVISION=${{ matrix.image == 'hermes-base' && 'ci' || 'n/a' }}
            UV_INDEX_GITHUB_PASSWORD=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ matrix.image == 'hermes-base' }}

      - name: Hermes image size gate
        if: matrix.image == 'hermes-base'
        env:
          HERMES_IMAGE_MAX_MIB: "1200"
        run: |
          bash scripts/hermes/check-hermes-image-size.sh \
            "ghcr.io/${{ github.repository_owner }}/agent-runtime/hermes-base:${{ github.sha }}"
