name: Prune GHCR images

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - agent-runtime/backend
          - agent-runtime/auth
          - agent-runtime/deploy-api
          - agent-runtime/ext-authz
          - agent-runtime/agent-base
          - agent-runtime/mcp-base
          - agent-runtime/hermes-base
          - agent-runtime/path-graph-rag-mcp
    steps:
      - name: Keep only latest version (${{ matrix.package }})
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 1
          token: ${{ secrets.GITHUB_TOKEN }}
