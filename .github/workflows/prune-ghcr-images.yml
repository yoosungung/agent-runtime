name: Prune GHCR images

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only latest version per agent-runtime package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          mapfile -t packages < <(
            gh api "/users/${owner}/packages?package_type=container" --paginate \
              --jq '.[].name' | grep '^agent-runtime/' || true
          )
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No agent-runtime/* packages found"
            exit 0
          fi
          echo "Found ${#packages[@]} package(s): ${packages[*]}"
          for pkg in "${packages[@]}"; do
            encoded="${pkg//\//%2F}"
            echo "=== ${pkg} ==="
            mapfile -t ids < <(
              gh api "/users/${owner}/packages/container/${encoded}/versions" --paginate \
                --jq 'sort_by(.updated_at) | reverse | .[].id'
            )
            if [ "${#ids[@]}" -le 1 ]; then
              echo "Only ${#ids[@]} version(s), nothing to delete"
              continue
            fi
            echo "Keeping version ${ids[0]}, deleting $(( ${#ids[@]} - 1 )) older version(s)"
            for id in "${ids[@]:1}"; do
              echo "Deleting version ${id}"
              gh api --method DELETE --input /dev/null \
                "/users/${owner}/packages/container/${encoded}/versions/${id}"
            done
          done
