name: Hermes base OCI

on:
  pull_request:
    paths:
      - "runtimes/hermes-base/**"
      - "scripts/hermes/**"
      - "vendor/hermes-agent/**"
      - "packages/common/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/hermes-base-oci.yml"
  push:
    branches: [main]
    paths:
      - "runtimes/hermes-base/**"
      - "scripts/hermes/**"
      - "vendor/hermes-agent/**"
      - "packages/common/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/hermes-base-oci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install policy check
        run: bash scripts/hermes/check-hermes-install-policy.sh

      - name: OCI unit tests
        run: |
          uv sync --package hermes-base
          uv run pytest runtimes/hermes-base/tests/test_oci_runtime_slim.py \
            runtimes/hermes-base/tests/test_prune_hermes.py -q

      - name: Hermes-base unit tests (not integration)
        run: uv run pytest runtimes/hermes-base/tests -q -m "not integration"

  docker-slim:
    runs-on: ubuntu-latest
    needs: policy-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build hermes-base image
        env:
          GIT_SHA: ${{ github.sha }}
          HERMES_REVISION: ci
        run: |
          docker build \
            --build-arg GIT_SHA="$GIT_SHA" \
            --build-arg HERMES_REVISION="$HERMES_REVISION" \
            -f runtimes/hermes-base/Dockerfile \
            -t hermes-base:ci \
            .

      - name: Image size gate
        env:
          HERMES_IMAGE_MAX_MIB: "1200"
        run: bash scripts/hermes/check-hermes-image-size.sh hermes-base:ci
