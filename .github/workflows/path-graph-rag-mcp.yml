name: path-graph-rag-mcp

on:
  pull_request:
    paths:
      - "deploy/examples/custom-image/path-graph-rag-mcp/**"
      - "deploy/tests/test_build_images_workflow.py"
      - ".github/workflows/path-graph-rag-mcp.yml"
      - ".github/workflows/build-images.yml"
  push:
    branches: [main]
    paths:
      - "deploy/examples/custom-image/path-graph-rag-mcp/**"
      - "deploy/tests/test_build_images_workflow.py"
      - ".github/workflows/path-graph-rag-mcp.yml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout path-graph (hybrid_search import for tests)
        uses: actions/checkout@v4
        with:
          repository: yoosungung/path-graph
          ref: main
          path: _path_graph_repo

      - name: Stage path-graph for uv editable sources
        run: mkdir -p ../path-graph && cp -r _path_graph_repo/pipeline ../path-graph/

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Unit tests
        run: |
          uv sync --all-packages
          uv run pytest deploy/examples/custom-image/path-graph-rag-mcp/test_app.py \
            deploy/tests/test_build_images_workflow.py -q

  docker:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout path-graph for Docker build context
        uses: actions/checkout@v4
        with:
          repository: yoosungung/path-graph
          ref: main
          path: _path_graph

      - name: Stage path-graph package for Docker build
        run: rm -rf path-graph && mkdir -p path-graph && cp -r _path_graph/pipeline path-graph/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/examples/custom-image/path-graph-rag-mcp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/agent-runtime/path-graph-rag-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
