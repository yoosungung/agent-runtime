name: path-graph-rag-mcp

on:
  pull_request:
    paths:
      - "deploy/examples/custom-image/path-graph-rag-mcp/**"
      - "deploy/tests/test_build_images_workflow.py"
      - "deploy/tests/test_path_graph_dependency.py"
      - ".github/workflows/path-graph-rag-mcp.yml"
      - ".github/workflows/build-images.yml"
  push:
    branches: [main]
    paths:
      - "deploy/examples/custom-image/path-graph-rag-mcp/**"
      - "deploy/tests/test_build_images_workflow.py"
      - "deploy/tests/test_path_graph_dependency.py"
      - ".github/workflows/path-graph-rag-mcp.yml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Unit tests
        env:
          UV_INDEX_GITHUB_USERNAME: x-access-token
          UV_INDEX_GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv sync --all-packages
          uv run pytest deploy/examples/custom-image/path-graph-rag-mcp/test_app.py \
            deploy/tests/test_build_images_workflow.py \
            deploy/tests/test_path_graph_dependency.py -q

  docker:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags (full + short SHA)
        id: image_tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${OWNER}/agent-runtime/path-graph-rag-mcp:${GITHUB_SHA}"
            echo "ghcr.io/${OWNER}/agent-runtime/path-graph-rag-mcp:${short_sha}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/examples/custom-image/path-graph-rag-mcp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image_tags.outputs.tags }}
          build-args: |
            UV_INDEX_GITHUB_PASSWORD=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
