[project]
name = "email-bundle"
version = "0.1.0"
description = "Production MCP email server bundle (IMAP/POP3/SMTP, Outlook, Gmail)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.27",
    "httpx>=0.27",
    "msal>=1.31",
    "google-auth>=2.36",
    "google-api-python-client>=2.154",
    "email-validator>=2.2",
    "runtime-common",
]

[tool.uv.sources]
runtime-common = { workspace = true }
