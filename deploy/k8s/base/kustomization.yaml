apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: runtime
resources:
  - namespace.yaml
  - ../garage
  - _shared.yaml
  - secrets.yaml
  - serviceaccounts.yaml
  - postgres.yaml
  - pgbouncer.yaml
  - redis.yaml
  - migration-job.yaml
  - auth.yaml
  - deploy-api.yaml
  - backend.yaml
  - ext-authz.yaml
  - envoy.yaml
  - agent-pool-compiled-graph.yaml
  - agent-pool-adk.yaml
  - mcp-pool-fastmcp.yaml
  - mcp-pool-mcp-sdk.yaml
  - network-policy.yaml
  - backend-k8s-rbac.yaml
  - pdb.yaml
  - hpa.yaml
  - keda.yaml
  - ingress.yaml
patches:
  # GHCR :latest is mutable — rollout must pull fresh layers, not reuse node cache.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Deployment
secretGenerator:
  - name: s3-creds
    envs:
      - s3-creds.env
    options:
      disableNameSuffixHash: true
