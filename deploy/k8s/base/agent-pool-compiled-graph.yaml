apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-pool-compiled-graph
  namespace: runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-pool
      kind: compiled-graph
  template:
    metadata:
      labels:
        app: agent-pool
        kind: compiled-graph
        runtime/role: pool
    spec:
      serviceAccountName: agent-pool
      containers:
        - name: agent
          image: agents-runtime/agent-base:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "4Gi"
          envFrom:
            - configMapRef:
                name: runtime-env
            - configMapRef:
                name: runtime-infra
                optional: true
            - secretRef:
                name: runtime-infra-secrets
                optional: true
            - secretRef:
                name: s3-creds
          env:
            - name: SERVICE_NAME
              value: agent-pool-compiled-graph
            - name: RUNTIME_KIND
              value: compiled_graph
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_PORT
              value: "8080"
            - name: MAX_CONCURRENT
              value: "32"
            - name: INVOKE_TIMEOUT_SEC
              value: "7200"
            - name: JOB_INVOKE_TIMEOUT_SEC
              value: "7200"
            - name: REGISTRY_HEARTBEAT_INTERVAL_SEC
              value: "2"
            - name: REGISTRY_TTL_SEC
              value: "3"
            - name: MCP_GATEWAY_URL
              value: http://envoy.runtime.svc.cluster.local:8080
            - name: AGENT_GATEWAY_URL
              value: http://envoy.runtime.svc.cluster.local:8080
            - name: VFS_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: VFS_DSN
            - name: VFS_PGBOUNCER
              value: "true"
            - name: CHECKPOINTER_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: VFS_DSN
            - name: SESSION_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: VFS_DSN
            - name: ADMIN_BACKEND_URL
              value: http://backend.runtime.svc.cluster.local:8000
            - name: WIKI_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_BUCKET
          volumeMounts:
            - name: bundles
              mountPath: /var/cache/agent-bundles
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 60
      # Bundle cache volume. Default is emptyDir (cache is lost on pod restart).
      # For persistent cache, replace with a PVC:
      #   - name: bundles
      #     persistentVolumeClaim:
      #       claimName: agent-pool-bundle-cache
      # See deploy/DESIGN.md "PersistentVolume for bundle cache" for details.
      volumes:
        - name: bundles
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-pool-compiled-graph
  namespace: runtime
spec:
  selector:
    app: agent-pool
    kind: compiled-graph
  ports:
    - port: 8080
      targetPort: 8080
