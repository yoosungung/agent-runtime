apiVersion: v1
kind: ConfigMap
metadata:
  name: db-migrations
  namespace: runtime
# 소스 원본: backend/migrations/0001_init.sql … 0016_vfs_glob_indexes.sql — 수정 시 양쪽을 같이 업데이트.
# (kustomize configMapGenerator는 loadRestrictor 설정이 필요해 당분간 inline 유지.)
data:
  0001_init.sql: |
    -- agents-runtime — initial schema
    --
    -- 단일 Postgres에 쓰는 모든 테이블을 한 번에 생성. 쓰기 소유자는 admin backend.
    -- runtime 서비스(deploy-api / auth)는 각자 read-only 영역만 가짐 — 자세한 위임은
    -- backend/DESIGN.md "Postgres 스키마 (참고)".
    --
    -- 순서: 참조 없는 테이블 → FK 있는 테이블.

    -- ---------------------------------------------------------------------------
    -- auth 도메인
    -- ---------------------------------------------------------------------------

    CREATE TABLE IF NOT EXISTS users (
        id                   BIGSERIAL PRIMARY KEY,
        username             VARCHAR(128) NOT NULL,
        password_hash        VARCHAR(256) NOT NULL,      -- argon2id
        tenant               VARCHAR(64),
        disabled             BOOLEAN      NOT NULL DEFAULT FALSE,
        role                 VARCHAR(16)  NOT NULL DEFAULT 'user',
        must_change_password BOOLEAN      NOT NULL DEFAULT FALSE,  -- bootstrap admin = TRUE
        created_at           TIMESTAMPTZ  NOT NULL DEFAULT now(),
        updated_at           TIMESTAMPTZ  NOT NULL DEFAULT now(),
        CONSTRAINT uq_users_username UNIQUE (username),
        CONSTRAINT chk_users_role CHECK (role IN ('user', 'developer', 'admin'))
    );

    CREATE TABLE IF NOT EXISTS user_resource_access (
        user_id    BIGINT       NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        kind       VARCHAR(16)  NOT NULL,                -- 'agent' | 'mcp'
        name       VARCHAR(128) NOT NULL,                -- source_meta.name과 동일 어휘 (FK 없음)
        created_at TIMESTAMPTZ  NOT NULL DEFAULT now(),
        PRIMARY KEY (user_id, kind, name)
    );
    CREATE INDEX IF NOT EXISTS ix_ura_kind_name ON user_resource_access (kind, name);

    CREATE TABLE IF NOT EXISTS refresh_tokens (
        id          BIGSERIAL PRIMARY KEY,
        user_id     BIGINT       NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        token_hash  VARCHAR(128) NOT NULL UNIQUE,        -- sha256(plaintext)
        expires_at  TIMESTAMPTZ  NOT NULL,
        revoked_at  TIMESTAMPTZ,
        created_at  TIMESTAMPTZ  NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_refresh_tokens_user_id ON refresh_tokens(user_id);

    CREATE TABLE IF NOT EXISTS api_keys (
        id         SERIAL       PRIMARY KEY,
        key_hash   VARCHAR(128) UNIQUE NOT NULL,         -- argon2id(plaintext) — 컬럼명은 legacy
        name       VARCHAR(128) NOT NULL,
        tenant     VARCHAR(64),
        disabled   BOOLEAN      NOT NULL DEFAULT FALSE,
        created_at TIMESTAMPTZ  NOT NULL DEFAULT now(),
        expires_at TIMESTAMPTZ
    );

    -- ---------------------------------------------------------------------------
    -- 번들 / 이미지 / general agent 메타 도메인
    -- ---------------------------------------------------------------------------

    CREATE TABLE IF NOT EXISTS source_meta (
        id           BIGSERIAL PRIMARY KEY,
        kind         VARCHAR(16)  NOT NULL,              -- 'agent' | 'mcp'
        name         VARCHAR(128) NOT NULL,
        version      VARCHAR(64)  NOT NULL,
        runtime_pool VARCHAR(128) NOT NULL,              -- bundle: '{kind}:{runtime_kind}' | image: '{kind}:custom:{slug}'
        entrypoint   VARCHAR(256),                       -- bundle mode 필수
        bundle_uri   VARCHAR(512),                       -- bundle mode 필수
        checksum     VARCHAR(128),                       -- sha256:...
        sig_uri      VARCHAR(512),                       -- 서명 파일 URI (선택)
        config       JSONB        NOT NULL DEFAULT '{}'::jsonb,  -- 번들 기본 config (user_meta.config와 runtime merge)
        pool_env     JSONB        NOT NULL DEFAULT '{}'::jsonb,  -- custom image pool env (admin UI round-trip)
        retired      BOOLEAN      NOT NULL DEFAULT FALSE,
        deploy_mode  VARCHAR(16)  NOT NULL DEFAULT 'bundle',     -- 'bundle' | 'image' | 'general'
        image_uri    VARCHAR(512),                       -- image mode 필수
        image_digest VARCHAR(128),
        slug         VARCHAR(63),                        -- image mode 필수; (kind, slug) unique
        status       VARCHAR(16)  NOT NULL DEFAULT 'active',     -- 'pending' | 'active' | 'failed' | 'retired'
        created_at   TIMESTAMPTZ  NOT NULL DEFAULT now(),
        CONSTRAINT uq_source_meta_nv UNIQUE (kind, name, version),
        CONSTRAINT chk_source_meta_bundle_fields
            CHECK (
                deploy_mode != 'bundle'
                OR (entrypoint IS NOT NULL AND bundle_uri IS NOT NULL)
            ),
        CONSTRAINT chk_source_meta_image_fields
            CHECK (
                deploy_mode != 'image'
                OR (image_uri IS NOT NULL AND slug IS NOT NULL)
            ),
        CONSTRAINT chk_source_meta_general_fields
            CHECK (
                deploy_mode != 'general'
                OR (
                    entrypoint IS NULL AND bundle_uri IS NULL AND checksum IS NULL
                    AND image_uri IS NULL AND slug IS NULL
                    AND kind = 'agent' AND runtime_pool = 'agent:compiled_graph'
                )
            ),
        CONSTRAINT chk_source_meta_deploy_mode
            CHECK (deploy_mode IN ('bundle', 'image', 'general')),
        CONSTRAINT chk_source_meta_status
            CHECK (status IN ('pending', 'active', 'failed', 'retired'))
    );
    CREATE INDEX IF NOT EXISTS ix_source_meta_name ON source_meta (name);
    CREATE INDEX IF NOT EXISTS ix_source_meta_kind_name_created ON source_meta (kind, name, created_at DESC);
    CREATE INDEX IF NOT EXISTS ix_source_meta_checksum ON source_meta (checksum);  -- hard delete 참조 카운트
    CREATE INDEX IF NOT EXISTS ix_source_meta_status ON source_meta (status);
    CREATE UNIQUE INDEX IF NOT EXISTS uq_source_meta_kind_slug
        ON source_meta (kind, slug)
        WHERE slug IS NOT NULL;

    CREATE TABLE IF NOT EXISTS user_meta (
        id             BIGSERIAL PRIMARY KEY,
        source_meta_id BIGINT       NOT NULL REFERENCES source_meta(id) ON DELETE CASCADE,
        principal_id   VARCHAR(128) NOT NULL,
        config         JSONB        NOT NULL DEFAULT '{}'::jsonb,
        secrets_ref    VARCHAR(512),
        updated_at     TIMESTAMPTZ  NOT NULL DEFAULT now(),
        CONSTRAINT uq_user_meta_source_principal UNIQUE (source_meta_id, principal_id)
    );
    CREATE INDEX IF NOT EXISTS ix_user_meta_principal ON user_meta (principal_id);

    -- ---------------------------------------------------------------------------
    -- audit
    -- ---------------------------------------------------------------------------

    CREATE TABLE IF NOT EXISTS audit_log (
        id         BIGSERIAL PRIMARY KEY,
        action     VARCHAR(128) NOT NULL,
        actor_id   BIGINT       NOT NULL,
        actor      VARCHAR(128) NOT NULL,
        details    JSONB        NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ  NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS ix_audit_log_actor_id  ON audit_log (actor_id);
    CREATE INDEX IF NOT EXISTS ix_audit_log_action    ON audit_log (action);
    CREATE INDEX IF NOT EXISTS ix_audit_log_created   ON audit_log (created_at DESC);

    -- ---------------------------------------------------------------------------
    -- platform infra env registry
    -- ---------------------------------------------------------------------------

    CREATE TABLE IF NOT EXISTS infra_meta (
        id           BIGSERIAL PRIMARY KEY,
        scope        VARCHAR(16)  NOT NULL DEFAULT 'global',
        scope_key    VARCHAR(128) NOT NULL DEFAULT '',
        env          JSONB        NOT NULL DEFAULT '{}'::jsonb,
        secret_keys  JSONB        NOT NULL DEFAULT '[]'::jsonb,
        updated_at   TIMESTAMPTZ  NOT NULL DEFAULT now(),
        CONSTRAINT uq_infra_meta_scope UNIQUE (scope, scope_key)
    );

    INSERT INTO infra_meta (scope, scope_key)
    VALUES ('global', '')
    ON CONFLICT (scope, scope_key) DO NOTHING;
  0002_vfs.sql: |
    -- agents-runtime — VFS tables (general agent tier)
    -- Requires: users (0001_init.sql)
    -- path-graph vfs_triggers.sql applies after this on the same DSN (VFS_DSN).
    -- LangGraph checkpoint_* tables: created by agent-base AsyncPostgresSaver.setup() at pod startup (same DSN via CHECKPOINTER_DSN).

    CREATE TABLE IF NOT EXISTS vfs_agent_files (
        kind        VARCHAR(16)  NOT NULL DEFAULT 'agent',
        agent_name  VARCHAR(128) NOT NULL,
        path        TEXT         NOT NULL,
        parent_path TEXT         NOT NULL,
        name        TEXT         NOT NULL,
        is_dir      BOOLEAN      NOT NULL DEFAULT FALSE,
        size        INTEGER      NOT NULL DEFAULT 0,
        content     BYTEA        NOT NULL,
        encoding    VARCHAR(8)   NOT NULL DEFAULT 'utf-8',
        created_at  TIMESTAMPTZ  NOT NULL DEFAULT now(),
        modified_at TIMESTAMPTZ  NOT NULL DEFAULT now(),
        PRIMARY KEY (kind, agent_name, path)
    );

    CREATE TABLE IF NOT EXISTS vfs_user_files (
        user_id     BIGINT       NOT NULL REFERENCES users (id) ON DELETE CASCADE,
        path        TEXT         NOT NULL,
        parent_path TEXT         NOT NULL,
        name        TEXT         NOT NULL,
        is_dir      BOOLEAN      NOT NULL DEFAULT FALSE,
        size        INTEGER      NOT NULL DEFAULT 0,
        content     BYTEA        NOT NULL,
        encoding    VARCHAR(8)   NOT NULL DEFAULT 'utf-8',
        created_at  TIMESTAMPTZ  NOT NULL DEFAULT now(),
        modified_at TIMESTAMPTZ  NOT NULL DEFAULT now(),
        PRIMARY KEY (user_id, path)
    );

    CREATE INDEX IF NOT EXISTS ix_vfs_agent_files_parent
        ON vfs_agent_files (kind, agent_name, parent_path);

    CREATE INDEX IF NOT EXISTS ix_vfs_user_files_parent
        ON vfs_user_files (user_id, parent_path);
  0003_user_meta_template.sql: |
    -- Add admin-defined user_meta form template to source_meta (UI-only, not runtime merge).

    ALTER TABLE source_meta
        ADD COLUMN IF NOT EXISTS user_meta_template JSONB NOT NULL DEFAULT '{}'::jsonb;
  0004_general_visibility.sql: |
    -- General agent ownership + visibility (private | tenant | public)

    ALTER TABLE source_meta
        ADD COLUMN IF NOT EXISTS created_by_user_id BIGINT REFERENCES users (id) ON DELETE SET NULL,
        ADD COLUMN IF NOT EXISTS owner_tenant VARCHAR(64),
        ADD COLUMN IF NOT EXISTS visibility VARCHAR(16) NOT NULL DEFAULT 'private';

    ALTER TABLE source_meta DROP CONSTRAINT IF EXISTS chk_source_meta_visibility;
    ALTER TABLE source_meta
        ADD CONSTRAINT chk_source_meta_visibility
        CHECK (visibility IN ('private', 'tenant', 'public'));

    CREATE INDEX IF NOT EXISTS ix_source_meta_general_visibility
        ON source_meta (deploy_mode, visibility)
        WHERE deploy_mode = 'general' AND retired = FALSE;
  0005_llm_presets.sql: |
    -- LLM Presets table to store multiple named LLM configurations

    CREATE TABLE IF NOT EXISTS llm_presets (
        id                  BIGSERIAL PRIMARY KEY,
        name                VARCHAR(128) NOT NULL UNIQUE,
        description         VARCHAR(256),
        mode                VARCHAR(32) NOT NULL,
        frontier_provider   VARCHAR(32),
        model_id            VARCHAR(128) NOT NULL,
        openai_api_base     VARCHAR(512),
        slm_runtime         VARCHAR(32),
        is_default          BOOLEAN NOT NULL DEFAULT FALSE,
        api_key_configured  BOOLEAN NOT NULL DEFAULT FALSE,
        created_at          TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at          TIMESTAMPTZ NOT NULL DEFAULT now(),

        CONSTRAINT chk_llm_presets_name CHECK (name ~ '^[A-Z][A-Z0-9_]*$'),
        CONSTRAINT chk_llm_presets_mode CHECK (mode IN ('frontier', 'openai_compatible')),
        CONSTRAINT chk_llm_presets_frontier_provider CHECK (frontier_provider IN ('openai', 'anthropic', 'google')),
        CONSTRAINT chk_llm_presets_slm_runtime CHECK (slm_runtime IN ('vllm', 'sglang'))
    );

    CREATE UNIQUE INDEX IF NOT EXISTS uq_llm_presets_default
        ON llm_presets (is_default)
        WHERE (is_default = TRUE);

    DO $$
    DECLARE
        v_env JSONB;
        v_model_spec VARCHAR(128);
        v_mode VARCHAR(32);
        v_provider VARCHAR(32);
        v_model_id VARCHAR(128);
        v_api_base VARCHAR(512);
        v_runtime VARCHAR(32);
        v_idx INT;
        v_api_key_configured BOOLEAN := FALSE;
        v_secret_keys JSONB;
    BEGIN
        SELECT env, secret_keys INTO v_env, v_secret_keys
        FROM infra_meta
        WHERE scope = 'global' AND scope_key = ''
        LIMIT 1;

        IF v_env IS NOT NULL AND v_env ? 'DEFAULT_LLM_MODEL' AND (v_env->>'DEFAULT_LLM_MODEL') <> '' THEN
            v_model_spec := v_env->>'DEFAULT_LLM_MODEL';
            v_api_base := v_env->>'OPENAI_API_BASE';
            v_runtime := v_env->>'LLM_RUNTIME';

            v_idx := position(':' in v_model_spec);
            IF v_idx > 0 THEN
                v_provider := substring(v_model_spec from 1 for v_idx - 1);
                v_model_id := substring(v_model_spec from v_idx + 1);
            ELSE
                v_provider := 'openai';
                v_model_id := v_model_spec;
            END IF;

            IF v_api_base IS NOT NULL AND v_api_base <> '' THEN
                v_mode := 'openai_compatible';
                v_provider := 'openai';
            ELSE
                v_mode := 'frontier';
            END IF;

            IF v_secret_keys ? 'OPENAI_API_KEY' OR v_secret_keys ? 'ANTHROPIC_API_KEY' OR v_secret_keys ? 'GOOGLE_API_KEY' THEN
                v_api_key_configured := TRUE;
            END IF;

            INSERT INTO llm_presets (
                name, description, mode, frontier_provider, model_id, openai_api_base, slm_runtime, is_default, api_key_configured
            ) VALUES (
                'DEFAULT_PRESET',
                'Migrated platform default preset',
                v_mode,
                v_provider,
                v_model_id,
                v_api_base,
                v_runtime,
                TRUE,
                v_api_key_configured
            ) ON CONFLICT (name) DO NOTHING;

            UPDATE infra_meta
            SET env = env - 'DEFAULT_LLM_MODEL' - 'OPENAI_API_BASE' - 'LLM_RUNTIME'
            WHERE scope = 'global' AND scope_key = '';
        END IF;
    END $$;
  0006_chat_threads.sql: |
    -- agents-runtime — chat thread registry (admin backend owned)
    -- Requires: users (0001_init.sql)

    CREATE TABLE IF NOT EXISTS chat_threads (
        id                    UUID         PRIMARY KEY,
        user_id               BIGINT       NOT NULL REFERENCES users (id) ON DELETE CASCADE,
        agent_name            VARCHAR(128) NOT NULL,
        thread_type           VARCHAR(16)  NOT NULL,
        provider_session_id   VARCHAR(128) NOT NULL,
        provider_meta         JSONB        NOT NULL DEFAULT '{}'::jsonb,
        title                 VARCHAR(256) NOT NULL DEFAULT 'New Chat',
        last_message_at       TIMESTAMPTZ  NOT NULL DEFAULT now(),
        created_at            TIMESTAMPTZ  NOT NULL DEFAULT now(),
        deleted_at            TIMESTAMPTZ,
        purged_at             TIMESTAMPTZ,
        CONSTRAINT chk_chat_threads_type CHECK (thread_type IN ('langgraph', 'adk', 'custom'))
    );

    CREATE INDEX IF NOT EXISTS ix_chat_threads_user_list
        ON chat_threads (user_id, deleted_at, last_message_at DESC);

    CREATE INDEX IF NOT EXISTS ix_chat_threads_user_agent
        ON chat_threads (user_id, agent_name);

    CREATE UNIQUE INDEX IF NOT EXISTS uq_chat_threads_user_provider_session
        ON chat_threads (user_id, provider_session_id);
  0007_api_keys_user_id.sql: |
    -- Bind API keys to users; reuse user_resource_access on /verify.
    -- Requires: users, api_keys (0001_init.sql)

    ALTER TABLE api_keys
        ADD COLUMN IF NOT EXISTS user_id BIGINT REFERENCES users(id) ON DELETE CASCADE;

    CREATE INDEX IF NOT EXISTS idx_api_keys_user_id ON api_keys(user_id);
  0008_chat_threads_agent_version.sql: |
    -- agents-runtime — pin agent version on chat threads
    -- Requires: chat_threads (0006_chat_threads.sql), source_meta (0001_init.sql)

    ALTER TABLE chat_threads
        ADD COLUMN IF NOT EXISTS agent_version VARCHAR(128);

    UPDATE chat_threads AS ct
    SET agent_version = COALESCE(
        (
            SELECT sm.version
            FROM source_meta AS sm
            WHERE sm.kind = 'agent'
              AND sm.name = ct.agent_name
              AND sm.retired = false
              AND sm.status != 'pending'
            ORDER BY sm.created_at DESC
            LIMIT 1
        ),
        (
            SELECT sm.version
            FROM source_meta AS sm
            WHERE sm.kind = 'agent'
              AND sm.name = ct.agent_name
            ORDER BY sm.created_at DESC
            LIMIT 1
        ),
        'unknown'
    )
    WHERE ct.agent_version IS NULL;

    ALTER TABLE chat_threads
        ALTER COLUMN agent_version SET NOT NULL;
  0009_users_tenant_not_null.sql: |
    -- users.tenant NOT NULL (single-tenant deployment; path-graph Admin Console contract).
    -- Requires: users (0001_init.sql)

    UPDATE users
    SET tenant = 'dev'
    WHERE tenant IS NULL OR btrim(tenant) = '';

    ALTER TABLE users
        ALTER COLUMN tenant SET NOT NULL;
  0013_vfs_wiki.sql: |
    -- Wiki VFS — pipeline GraphRAG wiki pages (tenant + project_id scope).

    CREATE TABLE IF NOT EXISTS vfs_wiki_files (
        tenant       TEXT NOT NULL,
        project_id   UUID NOT NULL,
        path         TEXT NOT NULL,
        parent_path  TEXT NOT NULL,
        name         TEXT NOT NULL,
        is_dir       BOOLEAN NOT NULL DEFAULT FALSE,
        size         INTEGER NOT NULL DEFAULT 0,
        content      BYTEA NOT NULL,
        encoding     VARCHAR(8) NOT NULL DEFAULT 'utf-8',
        created_at   TIMESTAMPTZ NOT NULL DEFAULT now(),
        modified_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (tenant, project_id, path)
    );

    CREATE INDEX IF NOT EXISTS ix_vfs_wiki_files_parent
        ON vfs_wiki_files (tenant, project_id, parent_path);
  0014_resource_visibility_allowlist.sql: |
    -- Extend source_meta.visibility with allowlist; backfill bundle/image ACL resources.

    ALTER TABLE source_meta DROP CONSTRAINT IF EXISTS chk_source_meta_visibility;
    ALTER TABLE source_meta
        ADD CONSTRAINT chk_source_meta_visibility
        CHECK (visibility IN ('private', 'tenant', 'public', 'allowlist'));

    UPDATE source_meta sm
    SET visibility = 'allowlist'
    WHERE sm.retired = FALSE
      AND EXISTS (
          SELECT 1
          FROM user_resource_access ura
          WHERE ura.kind = sm.kind
            AND ura.name = sm.name
      );
  0015_chat_threads_hermes.sql: |
    -- Allow Hermes profile agents in chat_threads.thread_type.

    ALTER TABLE chat_threads DROP CONSTRAINT IF EXISTS chk_chat_threads_type;
    ALTER TABLE chat_threads
        ADD CONSTRAINT chk_chat_threads_type
        CHECK (thread_type IN ('langgraph', 'adk', 'custom', 'hermes'));
  0016_vfs_glob_indexes.sql: |
    -- VFS glob query indexes — pg_trgm on name, varchar_pattern_ops on path.

    CREATE EXTENSION IF NOT EXISTS pg_trgm;

    CREATE INDEX IF NOT EXISTS ix_vfs_agent_files_path_prefix
        ON vfs_agent_files (kind, agent_name, path varchar_pattern_ops);

    CREATE INDEX IF NOT EXISTS ix_vfs_agent_files_name_trgm
        ON vfs_agent_files USING gin (name gin_trgm_ops);

    CREATE INDEX IF NOT EXISTS ix_vfs_user_files_path_prefix
        ON vfs_user_files (user_id, path varchar_pattern_ops);

    CREATE INDEX IF NOT EXISTS ix_vfs_user_files_name_trgm
        ON vfs_user_files USING gin (name gin_trgm_ops);

    CREATE INDEX IF NOT EXISTS ix_vfs_wiki_files_path_prefix
        ON vfs_wiki_files (tenant, project_id, path varchar_pattern_ops);

    CREATE INDEX IF NOT EXISTS ix_vfs_wiki_files_name_trgm
        ON vfs_wiki_files USING gin (name gin_trgm_ops);
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate-0016
  namespace: runtime
  annotations:
    migration-version: "0016"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      # TODO: backend 배포 도입 시 serviceAccountName 을 backend로 교체.
      serviceAccountName: deploy-api
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: pgvector/pgvector:pg17
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          envFrom:
            - secretRef:
                name: postgres-credentials
          command:
            - sh
            - -c
            - |
              set -e
              echo "Applying /migrations/0001_init.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0001_init.sql
              echo "Applying /migrations/0002_vfs.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0002_vfs.sql
              echo "Applying /migrations/0003_user_meta_template.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0003_user_meta_template.sql
              echo "Applying /migrations/0004_general_visibility.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0004_general_visibility.sql
              echo "Applying /migrations/0005_llm_presets.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0005_llm_presets.sql
              echo "Applying /migrations/0006_chat_threads.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0006_chat_threads.sql
              echo "Applying /migrations/0007_api_keys_user_id.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0007_api_keys_user_id.sql
              echo "Applying /migrations/0008_chat_threads_agent_version.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0008_chat_threads_agent_version.sql
              echo "Applying /migrations/0009_users_tenant_not_null.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0009_users_tenant_not_null.sql
              echo "Applying /migrations/0013_vfs_wiki.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0013_vfs_wiki.sql
              echo "Applying /migrations/0014_resource_visibility_allowlist.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0014_resource_visibility_allowlist.sql
              echo "Applying /migrations/0015_chat_threads_hermes.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0015_chat_threads_hermes.sql
              echo "Applying /migrations/0016_vfs_glob_indexes.sql ..."
              psql "$POSTGRES_DIRECT_DSN" -f /migrations/0016_vfs_glob_indexes.sql
              echo "Migration applied."
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: db-migrations
