apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      containers:
        - name: backend
          image: agents-runtime/backend:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: runtime-env
            - secretRef:
                name: postgres-credentials
            - secretRef:
                name: s3-creds
            - secretRef:
                name: pipeline-infra-secrets
          env:
            - name: SERVICE_NAME
              value: backend
            - name: AUTH_URL
              value: http://auth:8080
            - name: BACKEND_SERVE_SPA
              value: "true"
            # Pool pods fetch bundles via the loader's http scheme handler;
            # without a public base URL, stored bundle_uri lacks a scheme
            # and the loader rejects it ("unsupported bundle scheme: ").
            - name: BUNDLE_PUBLIC_BASE_URL
              value: http://backend.runtime.svc.cluster.local:8000/bundles
            - name: INITIAL_ADMIN_PASSWORD_FILE
              value: /run/secrets/initial-admin-password
            - name: PIPELINE_STORAGE_BACKEND
              value: s3
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_SECRET_ACCESS_KEY
            - name: VFS_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: VFS_DSN
                  optional: true
            - name: VFS_PGBOUNCER
              value: "true"
            - name: CHECKPOINTER_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: VFS_DSN
                  optional: true
          volumeMounts:
            - name: initial-admin-password
              mountPath: /run/secrets/initial-admin-password
              subPath: password
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
      volumes:
        - name: initial-admin-password
          secret:
            secretName: initial-admin-password
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: runtime
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
