apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: runtime
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /data/ENV
        value: prod
      - op: replace
        path: /data/LOG_LEVEL
        value: INFO
      - op: replace
        path: /data/OTLP_ENDPOINT
        value: http://otel-collector.monitoring.svc.cluster.local:4317
    target:
      kind: ConfigMap
      name: runtime-env
