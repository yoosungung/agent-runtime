apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: runtime
resources:
  - ../../base
components:
  - ../../components/ghcr-images
patches:
  - patch: |-
      - op: replace
        path: /data/ENV
        value: dev
      - op: replace
        path: /data/LOG_LEVEL
        value: DEBUG
      - op: replace
        path: /data/OTLP_ENDPOINT
        value: http://otel-collector.monitoring.svc.cluster.local:4317
    target:
      kind: ConfigMap
      name: runtime-env
  - patch: |-
      $patch: delete
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: unused
    target:
      group: keda.sh
      kind: ScaledObject
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Deployment
      name: pgbouncer-rw
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Deployment
      name: pgbouncer-ro
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_DSN
          value: "postgresql+asyncpg://runtime:runtime@postgres.runtime.svc.cluster.local:5432/runtime?sslmode=disable"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_READ_DSN
          value: "postgresql+asyncpg://runtime:runtime@postgres.runtime.svc.cluster.local:5432/runtime?sslmode=disable"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_PGBOUNCER
          value: "false"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SESSION_COOKIE_SECURE
          value: "false"
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_DSN
          value: "postgresql+asyncpg://runtime:runtime@postgres.runtime.svc.cluster.local:5432/runtime?sslmode=disable"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_READ_DSN
          value: "postgresql+asyncpg://runtime:runtime@postgres.runtime.svc.cluster.local:5432/runtime?sslmode=disable"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_PGBOUNCER
          value: "false"
    target:
      kind: Deployment
      name: auth
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_DSN
          value: "postgresql+asyncpg://runtime:runtime@postgres.runtime.svc.cluster.local:5432/runtime?sslmode=disable"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_READ_DSN
          value: "postgresql+asyncpg://runtime:runtime@postgres.runtime.svc.cluster.local:5432/runtime?sslmode=disable"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POSTGRES_PGBOUNCER
          value: "false"
    target:
      kind: Deployment
      name: deploy-api
  - patch: |-
      - op: replace
        path: /stringData/PATH_GRAPH_DSN
        value: "postgresql://runtime:runtime@postgres.runtime.svc.cluster.local:5432/runtime?sslmode=disable"
    target:
      kind: Secret
      name: pipeline-infra-secrets
  - patch: |-
      - op: replace
        path: /stringData/VFS_DSN
        value: "postgresql://runtime:runtime@postgres.runtime.svc.cluster.local:5432/runtime?sslmode=disable"
    target:
      kind: Secret
      name: postgres-credentials
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/11/value
        value: "false"
    target:
      kind: Deployment
      name: agent-pool-compiled-graph
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/11/value
        value: "false"
    target:
      kind: Deployment
      name: agent-pool-adk
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value
        value: "false"
    target:
      kind: Deployment
      name: agent-pool-hermes
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
    target:
      kind: HorizontalPodAutoscaler
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: agents.k8s-test
      - op: remove
        path: /spec/tls
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "false"
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
    target:
      kind: Ingress
      name: agents-runtime
