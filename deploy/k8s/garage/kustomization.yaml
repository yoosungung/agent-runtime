apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: runtime
resources:
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
  - network-policy.yaml
secretGenerator:
  - name: garage-secrets
    envs:
      - garage-secrets.env
    options:
      disableNameSuffixHash: true
