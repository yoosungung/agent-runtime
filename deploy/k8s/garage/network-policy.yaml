# Garage S3 API: only backend and pool pods in runtime may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage-s3-ingress
spec:
  podSelector:
    matchLabels:
      app: garage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 3900
    - from:
        - podSelector:
            matchLabels:
              runtime/role: pool
      ports:
        - port: 3900
    - from:
        - podSelector:
            matchLabels:
              app: agent-pool
      ports:
        - port: 3900
    - from:
        - podSelector:
            matchLabels:
              app: mcp-pool
      ports:
        - port: 3900
